[project]
name = "local-software-factory"
version = "0.1.3"
description = "A durable local development supervisor with replaceable agent runtimes."
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
software-factory = "factory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.setuptools.package-data]
factory = ["sandbox/*.sb"]
