name: Security

on:
  push:
    branches: [main, 'security/**']
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Static analysis and secret history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned static-analysis tool
        run: python -m pip install --disable-pip-version-check -r requirements-security.txt
      - name: Check medium and high severity static findings
        run: python -m bandit -r factory scripts -ll
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/security-tools"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/security-tools/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/security-tools/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/security-tools/gitleaks.tar.gz" -C "$RUNNER_TEMP/security-tools" gitleaks
          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"
      - name: Scan all available Git refs without logging secret matches
        run: python -m scripts.scan_secrets
