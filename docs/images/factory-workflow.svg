<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">From a scoped ticket to a reviewed branch</title>
  <desc id="description">A conceptual workflow, not a live job. Beads supplies a ticket and file scope. A local agent implements it in an isolated worktree. Tests and independent review verify the exact commit. Changes requested return to implementation. The supervisor retains progress after restarts.</desc>
  <rect width="1200" height="430" rx="20" fill="#0d1117"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="38" y="42" fill="#7ee7b5" font-size="14" font-weight="700" letter-spacing="2">THE LOCAL DELIVERY LOOP</text>
    <text x="38" y="91" fill="#f0f6fc" font-size="35" font-weight="700">Your ticket. A reviewed commit.</text>
    <text x="38" y="126" fill="#b1bac4" font-size="18">Implementation, tests and independent review in your project.</text>
    <rect x="1000" y="26" width="162" height="29" rx="14" fill="#172b23"/>
    <text x="1081" y="45" text-anchor="middle" fill="#7ee7b5" font-size="11" font-weight="700" letter-spacing="1">LOCAL EXECUTION</text>
    <g fill="#161d27" stroke="#303b4b">
      <rect x="38" y="161" width="260" height="132" rx="12"/>
      <rect x="326" y="161" width="260" height="132" rx="12"/>
      <rect x="614" y="161" width="260" height="132" rx="12"/>
      <rect x="902" y="161" width="260" height="132" rx="12" stroke="#397b60"/>
    </g>
    <g font-size="13" font-weight="700" letter-spacing="1.4">
      <text x="58" y="190" fill="#8b949e">01 / DEFINE</text>
      <text x="346" y="190" fill="#79c0ff">02 / BUILD</text>
      <text x="634" y="190" fill="#d2a8ff">03 / CHECK</text>
      <text x="922" y="190" fill="#7ee7b5">04 / DELIVER</text>
    </g>
    <g fill="#f0f6fc" font-size="25" font-weight="700">
      <text x="58" y="229">Ticket</text>
      <text x="346" y="229">Implement</text>
      <text x="634" y="229">Verify</text>
      <text x="922" y="229">Reviewed branch</text>
    </g>
    <g fill="#b1bac4" font-size="16">
      <text x="58" y="262">Beads + explicit file scope</text>
      <text x="346" y="262">Isolated Git worktree</text>
      <text x="634" y="262">Tests + exact-commit review</text>
      <text x="922" y="262">Ready for your next step</text>
    </g>
    <g fill="none" stroke="#738397" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M304 226 H318 M312 220 L318 226 L312 232"/>
      <path d="M592 226 H606 M600 220 L606 226 L600 232"/>
      <path d="M880 226 H894 M888 220 L894 226 L888 232"/>
    </g>
    <path d="M744 303 V325 H456 V303 M451 309 L456 303 L461 309" fill="none" stroke="#e3b66e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="352" text-anchor="middle" fill="#e3b66e" font-size="15">Fix, test and review again.</text>
    <path d="M38 372 H1162" stroke="#28313e"/>
    <g fill="#b1bac4" font-size="15">
      <circle cx="45" cy="398" r="4" fill="#7ee7b5"/>
      <text x="61" y="403">Resume after restarts</text>
      <circle cx="451" cy="398" r="4" fill="#79c0ff"/>
      <text x="467" y="403">Feature + model cost estimates</text>
      <circle cx="904" cy="398" r="4" fill="#d2a8ff"/>
      <text x="920" y="403">Controlled integration</text>
    </g>
  </g>
</svg>
