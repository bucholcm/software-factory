<text x="54" y="889" fill="#9aaac0" font-family="Menlo,Consolas,monospace" font-size="16" font-weight="400">terminal.</text>
<rect x="322" y="120" width="690" height="844" rx="12" fill="#101a27" stroke="#2a3b52"/>
<path d="M334 120 H1000 Q1012 120 1012 132 V164 H322 V132 Q322 120 334 120" fill="#19283c"/>
<text x="344" y="148" fill="#aabed8" font-family="Menlo,Consolas,monospace" font-size="15" font-weight="700">FACTORY STATUS · EXAMPLE SNAPSHOT</text>
<text x="346" y="201" fill="#63d9cf" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">LOCAL SOFTWARE FACTORY</text>
<text x="346" y="236" fill="#dce7f5" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">factory-demo</text>
<text x="346" y="292" fill="#80dfb1" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">● RUNNING / READY</text>
<text x="346" y="345" fill="#dce7f5" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">Mode        SOURCE REVIEW</text>
<text x="346" y="379" fill="#dce7f5" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">Phase       idle</text>
<text x="346" y="413" fill="#dce7f5" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">Workers     0 active</text>
<text x="346" y="447" fill="#dce7f5" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">Heartbeat   1s ago</text>
<text x="346" y="510" fill="#7ba8ff" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">JOBS</text>
<text x="346" y="547" fill="#dce7f5" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">demo-a11.2  →  awaiting owner validation</text>
<text x="346" y="581" fill="#9aaac0" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">Source stays on its reviewed branch.</text>
<text x="346" y="643" fill="#7ba8ff" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">PIPELINE</text>
<text x="346" y="680" fill="#dce7f5" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">Implement → Test → Review → Fix</text>
<text x="346" y="714" fill="#dce7f5" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">Checkpoint → Integrate (mode-dependent)</text>
<text x="346" y="788" fill="#9aaac0" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">Activation requires an explicit release.</text>
<text x="346" y="894" fill="#9aaac0" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">Ctrl+C closes this view.</text>
<text x="346" y="926" fill="#9aaac0" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">The supervisor continues running.</text>
<rect x="1032" y="120" width="736" height="844" rx="12" fill="#101a27" stroke="#2a3b52"/>
<path d="M1044 120 H1756 Q1768 120 1768 132 V164 H1032 V132 Q1032 120 1044 120" fill="#19283c"/>
