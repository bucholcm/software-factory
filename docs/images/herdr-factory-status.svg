<text x="54" y="201" fill="#f0f5fc" font-family="Menlo,Consolas,monospace" font-size="21" font-weight="700">factory-demo</text>
<text x="54" y="248" fill="#839bb9" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="700">CODING AGENTS</text>
<text x="54" y="288" fill="#80dfb1" font-family="Menlo,Consolas,monospace" font-size="20" font-weight="400">● Codex</text>
<text x="74" y="318" fill="#a3b4cc" font-family="Menlo,Consolas,monospace" font-size="16" font-weight="400">implementation</text>
