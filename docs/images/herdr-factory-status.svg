<text x="74" y="394" fill="#a3b4cc" font-family="Menlo,Consolas,monospace" font-size="16" font-weight="400">planning / review</text>
<text x="54" y="466" fill="#839bb9" font-family="Menlo,Consolas,monospace" font-size="14" font-weight="700">TERMINALS</text>
<text x="54" y="506" fill="#76cfc9" font-family="Menlo,Consolas,monospace" font-size="18" font-weight="400">factory-status</text>
