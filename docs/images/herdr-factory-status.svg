<text x="1056" y="242" fill="#63d9cf" font-family="Menlo,Consolas,monospace" font-size="19" font-weight="400">Codex     $factory demo-a11.2</text>
<text x="1056" y="277" fill="#63d9cf" font-family="Menlo,Consolas,monospace" font-size="19" font-weight="400">OpenCode  /factory demo-a11.2</text>
<text x="1056" y="329" fill="#9aaac0" font-family="Menlo,Consolas,monospace" font-size="16" font-weight="400">OpenCode implementation sandbox is not configured</text>
<text x="1056" y="355" fill="#9aaac0" font-family="Menlo,Consolas,monospace" font-size="16" font-weight="400">in this pilot; it supports planning and review.</text>
<path d="M1056 390 H1742" stroke="#2a3b52"/>
<text x="1056" y="434" fill="#f0f5fc" font-family="Menlo,Consolas,monospace" font-size="22" font-weight="700">Example completion report</text>
<text x="1056" y="482" fill="#7ba8ff" font-family="Menlo,Consolas,monospace" font-size="17" font-weight="400">demo-a11.2 · Add preview validation</text>
<text x="1056" y="532" fill="#dce7f5" font-family="Menlo,Consolas,monospace" font-size="17" font-weight="400">Changed     scoped implementation + tests</text>
<text x="1056" y="568" fill="#80dfb1" font-family="Menlo,Consolas,monospace" font-size="17" font-weight="400">Checks      deterministic checks passed</text>
<text x="1056" y="604" fill="#80dfb1" font-family="Menlo,Consolas,monospace" font-size="17" font-weight="400">Review      exact commit reviewed</text>
<text x="1056" y="640" fill="#80dfb1" font-family="Menlo,Consolas,monospace" font-size="17" font-weight="400">Checkpoint  verified code backup</text>
<text x="1056" y="695" fill="#dce7f5" font-family="Menlo,Consolas,monospace" font-size="17" font-weight="400">Delivered   branch + revision + evidence paths</text>
<text x="1056" y="731" fill="#e8c985" font-family="Menlo,Consolas,monospace" font-size="17" font-weight="400">Next        owner validates the completed flow</text>
<text x="1056" y="806" fill="#9aaac0" font-family="Menlo,Consolas,monospace" font-size="17" font-weight="400">Source-review retains source on its branch.</text>
<text x="1056" y="842" fill="#9aaac0" font-family="Menlo,Consolas,monospace" font-size="17" font-weight="400">Verify the actual job evidence before accepting.</text>
<text x="1056" y="916" fill="#9aaac0" font-family="Menlo,Consolas,monospace" font-size="17" font-weight="400">Example only — no model job ran for this image.</text>
<text x="40" y="1007" fill="#9aaac0" font-family="Arial,sans-serif" font-size="18" font-weight="400">Layout guide: agents on the left, supervisor status in the middle, delivery in the coding-agent terminal.</text>
